 fire:{n:"灰",d:"極める力が暴走すると、炎は内側だけで燃え、やがて灰になります。「どうせ誰もわかってくれない」と人を信用しなくなり、自分の世界に閉じこもって、外とのつながりを断ってしまいます。",h:"わかってもらうことより、ひとりでいいので、本音を話せる相手を持ってください。考えていることを外に出す、誰かに教えてみる。炎は外の空気に触れると、また大きく燃え上がります。"}

 '<div class="card"><div class="orbs">'+KEYS.map(function(k){return '<div class="o">'+orb(k,54)+'<b style="color:'+S[k].c+'">'+S[k].n+'</b><small>'+S[k].t+'</small></div>'}).join('')+'</div>'+
 '<p>人の心には、4つの精霊が宿っているといわれます。</p><p style="margin-top:8px">前へ進む風の精霊シルフ、感じる水の精霊ウンディーネ、支える大地の精霊ガイア、極める炎の精霊インフェルノ。</p><p style="margin-top:8px">「本来のあなた」「周りから見たあなた」「なりたいあなた」の3つの視点から、あなたにどの精霊が宿っているかを読み解きます。</p>'+

function profile(){
 app.innerHTML='<div class="hero"><p class="eyebrow">STEP 1</p><h1>あなたのお名前を</h1></div><div class="card"><p>結果に表示するお名前を入れてください。</p>'+
 '<label>お名前（ニックネーム可）<input id="nm" value="'+esc(st.name)+'" placeholder="例：たくみ"></label>'+

}
function startQ(){st.name=document.getElementById("nm").value.trim()||"あなた";st.birth=document.getElementById("bd").value;st.i=0;st.ans=[];st.dark=[];question()}

 if(st.i>=Q.length){darkQ();return}
 var ly=Q[st.i][0],q=Q[st.i][1],opts=Q[st.i][2],L=LAYERS[ly];
 var first=st.i===0||Q[st.i-1][0]!==ly;
 var hint=ly==="hyo"?"人からどう見られているかを思い浮かべて答えてください。":ly==="shi"?"今の自分ではなく、なりたい自分を思い浮かべて答えてください。":"考えすぎず、直感で答えてください。";
 app.innerHTML='<div class="top"><button class="back" onclick="prev()">← 戻る</button><span>'+(st.i+1)+' / '+TOTAL+'</span></div><div class="bar"><i style="width:'+(st.i/TOTAL*100)+'%"></i></div>'+
 '<div class="card"><span class="layer" style="color:'+L.c+';border-color:'+L.c+'">'+L.n+'：'+L.t+'</span>'+
 (first?'<p class="note" style="margin:0 0 12px">ここからは「'+L.d+'」を読み解く質問です。'+hint+'</p>':'')+
 '<div class="q">'+q+'</div>'+ORDER[st.i].map(function(k){return '<button class="opt'+(st.ans[st.i]===k?' sel':'')+'" data-k="'+k+'" onclick="pick('+k+')">'+opts[k]+'</button>'}).join('')+'</div>';

 st.ans[st.i]=k;
 document.querySelectorAll(".opt").forEach(function(b){b.classList.toggle("sel",+b.getAttribute("data-k")===k)});

}

 ans.forEach(function(k,i){r[Q[i][0]][KEYS[k]]++});
 for(var l in r){var tot=0;KEYS.forEach(function(k){tot+=r[l][k]});tot=tot||1;KEYS.forEach(function(k){r[l][k]=Math.round(r[l][k]/tot*100)})}
 return r;
}

function matrix(r){

 var dots=Object.keys(LAYERS).map(function(ly,i){var o=r[ly];var x=((o.wind+o.water)-(o.fire+o.earth))/100;var y=((o.wind+o.fire)-(o.water+o.earth))/100;return '<i class="dot" style="left:'+(50+x*40+(i-1)*3)+'%;top:'+(50-y*40)+'%;background:'+LAYERS[ly].c+'">'+LAYERS[ly].s+'</i>'}).join('');
 var lg=Object.keys(LAYERS).map(function(ly){return '<span><i style="background:'+LAYERS[ly].c+'">'+LAYERS[ly].s+'</i>'+LAYERS[ly].t+'</span>'}).join('');
 return '<div class="mxw"><div class="ax t">動の力（陽）</div><div class="ax b">静の力（陰）</div><div class="ax l">内なる世界</div><div class="ax r">外の世界</div><div class="mx">'+q('fire')+q('wind')+q('earth')+q('water')+dots+'</div></div><div class="lg">'+lg+'</div>';
}
function compare(r){
 var s=topEl(r.sen),h=topEl(r.hyo),v=topEl(r.shi),t=[];
 if(s.some(function(k){return h.indexOf(k)>=0}))t.push('あなたの魂に宿る精霊（'+nms(s)+'）が、そのまま周りにも伝わっています。自分らしさを自然に出せている状態です。');
 else t.push('あなたの魂には「'+nms(s)+'」が宿っているのに、周りには「'+nms(h)+'」を纏っているように見えています。知らないうちに、役割に合わせて無理をしているかもしれません。');
 if(v.some(function(k){return s.indexOf(k)>=0}))t.push('あなたを導く精霊（'+nms(v)+'）は、魂にもともと宿っている精霊です。今の強みを素直に伸ばすことが、なりたい自分への近道です。');
 else t.push('あなたを導く精霊は「'+nms(v)+'」。今はまだ眠っている力を、これから目覚めさせていきたい気持ちが表れています。');

function darkQ(){

 app.innerHTML='<div class="top"><button class="back" onclick="prev()">← 戻る</button><span>'+(st.i+1)+' / '+TOTAL+'</span></div><div class="bar"><i style="width:'+(st.i/TOTAL*100)+'%"></i></div>'+
 '<div class="card dark"><span class="layer" style="color:#ff5a7a;border-color:#ff5a7a">暗黒面の兆し：最近のあなた</span>'+

 '<div class="q">'+DQ[j][1]+'</div>'+FREQ.map(function(f){return '<button class="opt'+(st.dark[j]===f[1]?' sel':'')+'" data-v="'+f[1]+'" onclick="pickD('+f[1]+')">'+f[0]+'</button>'}).join('')+'</div>';

function calcDark(r,sig){
 var d={};
 KEYS.forEach(function(k,i){
  var g1=Math.abs(r.sen[k]-r.hyo[k]),g2=Math.abs(r.shi[k]-r.sen[k]);
  var gap=Math.min(50,Math.round(g1*0.8+g2*0.3));
  var s=Math.round((sig[i]||0)/3*50);
  d[k]=Math.min(100,gap+s);
 });
 return d;
}
function darkTotal(d){var v=KEYS.map(function(k){return d[k]||0});var mx=Math.max.apply(null,v);var avg=v.reduce(function(a,b){return a+b},0)/4;return Math.round(mx*0.6+avg*0.4)}
function dLevel(v){return v>=BORDER?["暴走","#ff4d6d"]:v>=30?["兆しあり","#ffb15a"]:["穏やか","#7ad7a8"]}

 var rows=KEYS.map(function(k){var l=dLevel(d[k]);return '<div><span style="color:'+S[k].c+'">'+S[k].n+'</span><em class="dm"><i style="width:'+d[k]+'%;background:'+l[1]+'"></i></em><small style="color:'+l[1]+'">'+d[k]+'%</small></div>'}).join('');
 return '<div class="card dark"><h2>精霊の暗黒面</h2>'+
 '<p class="note" style="margin:0 0 6px">精霊の力は、苦手なことを頑張りすぎたり、得意なことを抑え込みすぎたりすると、暗い方向へ暴走しはじめます。ボーダーラインは60%です。</p>'+
 '<div class="dtotal"><small>'+who+'の暗黒面 総合値</small><b style="color:'+lv[1]+'">'+tot+'%</b><span class="badge" style="background:'+(over?'#ff4d6d':'#2e7d5b')+'">'+(over?'ボーダーライン超え':'ボーダーライン以内')+'</span></div>'+
 '<p style="margin:10px 0">'+msg+'</p>'+
 '<div class="rows drows">'+rows+'</div><p class="note" style="margin-top:4px">点線がボーダーライン（60%）です。</p>'+
 '<div class="desc" style="border-color:#ff4d6d"><h3 style="color:#ff8fa3;margin-top:0">✦ 最も気をつけたい暗黒面：'+S[top].n+'の暗黒面「'+DARK[top].n+'」（'+d[top]+'%）</h3><p>'+DARK[top].d+'</p><h3 style="color:#ff8fa3">✦ 鎮めるには</h3><p>'+DARK[top].h+'</p></div></div>';
}
function hsh(s){var h=5381;s+='|elemental-2026';for(var i=0;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))|0}return (h>>>0).toString(36)}
function encodeRes(res){var a=[res.name];Object.keys(LAYERS).forEach(function(ly){KEYS.forEach(function(k){a.push(res.r[ly][k])})});KEYS.forEach(function(k){a.push(res.d?res.d[k]:0)});var j=JSON.stringify(a);return btoa(unescape(encodeURIComponent(j))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')+'.'+hsh(j)}
function decodeRes(code){try{var p=code.split('.');var b=p[0].replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';var j=decodeURIComponent(escape(atob(b)));var a=JSON.parse(j);var res={name:String(a[0]).slice(0,30),r:{},d:{}};var i=1;Object.keys(LAYERS).forEach(function(ly){res.r[ly]={};KEYS.forEach(function(k){res.r[ly][k]=+a[i++]||0})});KEYS.forEach(function(k){res.d[k]=Math.min(100,+a[i++]||0)});res.bad=hsh(j)!==p[1];return res}catch(e){return null}}

  var desc=t.map(function(k){return '<div class="desc" style="border-color:'+S[k].c+'"><p>'+S[k].d+'</p><h3 style="color:'+S[k].c+'">✦ '+S[k].n+'の力を高めるには</h3><p>'+S[k].env+'</p></div>'}).join('');
  return '<div class="card"><span class="layer" style="color:'+L.c+';border-color:'+L.c+'">'+L.n+'：'+L.t+'</span><div class="res-el">'+orb(t[0],58)+'<div><b style="color:'+m.c+'">'+nms(t)+'</b><br><small>'+t.map(function(k){return S[k].t+'・'+S[k].k}).join(' / ')+'</small></div></div><div class="rows">'+bars+'</div>'+desc+'</div>';
 }).join('');
 var table=KEYS.map(function(k){return '<div class="trow"><div class="tl" style="color:'+S[k].c+'">'+orb(k,34)+S[k].n+'</div><div class="tr"><h3 style="color:'+S[k].c+';margin-top:0">'+S[k].t+'・'+S[k].k+'</h3><p>'+S[k].d+'</p><h3 style="color:'+S[k].c+'">✦ 力を高めるには</h3><p>'+S[k].env+'</p></div></div>'}).join('');

 '<div class="card"><h2>3つの精霊</h2><div class="sms">'+summary+'</div></div>'+(res.d?darkCard(res.d,shared,res.name):'')+
 '<div class="card"><h2>精霊の星図</h2><p class="note" style="margin:0">3つの視点で、あなたがどの精霊の領域にいるかを表しています。</p>'+matrix(r)+'</div>'+
 blocks+
 '<div class="card"><h2>3つの視点から見えること</h2>'+compare(r).map(function(x){return '<p style="margin-bottom:10px">'+x+'</p>'}).join('')+'</div>'+
 '<div class="card"><h2>4つの精霊</h2>'+table+'</div>'+
 (shared?'<div class="card"><h2>あなたも診断してみる</h2><p>あなたに宿る精霊と、暗黒面の状態は？全22問・約4分で診断できます。</p><button class="btn" onclick="startFresh()">自分も診断する</button></div>':'<div class="card"><h2>結果をシェアする</h2><p class="note" style="margin:0 0 4px">ボタンから結果のURLを送れます。開いた人は、あなたの結果（暗黒面も含む）をそのまま見られます。</p><a class="btn line" href="https://social-plugins.line.me/lineit/share?url='+encodeURIComponent(shareUrl(res))+'" target="_blank" rel="noopener">LINEで送る</a><a class="btn x" href="https://twitter.com/intent/tweet?text='+encodeURIComponent(shareText(res))+'&url='+encodeURIComponent(shareUrl(res))+'" target="_blank" rel="noopener">Xでシェア</a><button class="btn ghost" onclick="copyLink()">結果のURLをコピー</button>'+(navigator.share?'<button class="btn ghost" onclick="share()">ほかのアプリで送る</button>':'')+cta+'<button class="btn ghost" onclick="startFresh()">トップにもどる</button><p class="note">この診断は自己理解を楽しむためのもので、医学的・心理学的な診断ではありません。</p></div>');
 window.scrollTo(0,0);
}
