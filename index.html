<script>
// ===== 設定 =====
const LINE_URL="https://line.me/R/ti/p/%40vtt8412y"; // 詳しいレポート案内先（差し替え可）

const E={
 wind:{n:"風",c:"#3e9e4a",ic:"風",k:"実現と達成",d:"実現と達成の属性です。この属性のエネルギーが強い人は、結果や功績を出すために突き進む力に長けています。未来を切り拓いていくことに人一倍意識が向き、そのために努力を惜しみません。一方で、細かい部分にまで気を配ることは苦手で、仕事も人間関係も雑になりがちという側面もあります。後先考えないことも多々あるため、トラブルメーカーになりやすい部分も否めません。",env:"とにかく突き進むことが重要です。見切り発車で良いのでどんどん行動を起こして、達成・実現していくことでこの属性は強まります。細かい説明や言語化は置いておいて、ノリや勢いを最優先に。そして、途中経過よりも結果にコミットする姿勢を持つことです。未経験なことにも勇気を持って挑戦し、道を切り拓いていってください。",kw:["邁進","行動力","成功","ノリと勢い","達成","見栄","刺激","拡げる","1対多","放つ","実現する","リーダーシップ","直進","結果主義","勝利","目立つ"]},
 water:{n:"水",c:"#2f9ad8",ic:"水",k:"感性と解放",d:"感性と解放の属性です。この属性のエネルギーが強い人は、感性や感情をとても大切にします。感情表現が豊かで、様々な人から好かれやすく、ムードメーカー的な存在になることもあります。一方で、一度落ち込んだり不調になると、それが長続きしてしまうこともあります。自分の感情や気持ちのコンディションに、肉体も引きずられがち。束縛を嫌い、常に自由で満たされていたいと考える傾向が強いです。",env:"感情と感覚をできる限り鋭敏にすることが、この属性のエネルギーを強めます。何かを決める時、「正しいかどうか」ではなく「気持ちいいか」「嬉しいか」という、自分自身の心の欲求にトコトン従うことです。そして、なるべくドキドキワクワクする状況に身を置くことが大切です。その日の気分で行きたいところに出かけましょう。",kw:["感情優先","適応する","直観","飽きっぽい","包容力","傾聴","臨機応変","受け取る","フットワーク軽い","緩める","感性","感覚的","解放","共感","多対多","好奇心"]},
 earth:{n:"地",c:"#b08a2a",ic:"地",k:"安心と調和",d:"安心と調和の属性です。この属性のエネルギーが強い人は、協調性が高く、場の空気を読むことに長けています。物事を整理・調整したり、周到に計画を立てるチカラに優れているため、自分はもとより周りにも安心感をもたらします。一方で、気が小さく引っ込み思案であったり、行動が遅い・優柔不断という面も持っています。計画的にいかないとすぐ不安になり、行動を起こせなかったりもします。",env:"最も重要な考え方は、「どうすればみんなが良いと思えるのか」ということです。大きな成果や目立った成功より、全体のバランスが整っているかどうかをよく見ることが大切です。そして、「何をするか」よりも「誰とするか」「どうやってするか」という、プロセスの方を重要視することです。また、刺激が沢山ありすぎると疲れてしまうので、新しい出会いよりも気心知れた人と長い時間を過ごすことがポイントです。",kw:["プロセス重視","ファシリテーション","気配り","説明する","マネジメント","長期的","平穏","計画的","事務作業","把握する","協調","整理する","1対1","調整","調和","安心"]},
 fire:{n:"火",c:"#dc3a2a",ic:"火",k:"創造と論理",d:"創造と論理の属性です。この属性のエネルギーが強い人は、専門性の高さや問題解決の力があるとともに、本質を見抜くチカラに長けています。クリエイティブなセンスを持ち合わせ、自分の得意分野では圧倒的な成果を出すことができます。一方で、人の感情の機微に疎いので、人間関係に苦手意識があり、自分の世界に閉じこもりがちです。物事の核心部分以外はどうでもよく感じてしまい、回り道を嫌うので、他者との軋轢を生むことも少なくありません。",env:"物事の「理」を知ること、本質を理解することが何より重要となります。言いたいことや物事の優先順位を付けることなどに焦点を当ててください。また、あれこれ手をつけるより、ひとつをトコトン深め、極めていくことでも、この属性のエネルギーは高まります。同じ趣味、同じ分野で鎬を削り合える仲間を持ちましょう。",kw:["本質","自信","専門性","孤独","言語化","深める","論理","納得","研究","鍛錬","思考重視","こだわり","集中力","情熱","正しさ","クリエイション"]}
};
const LC={sen:"#6a4fd8",hyo:"#f08c2a",shi:"#e0408a"};
const KEYS=["wind","water","earth","fire"];
const LAYERS={
 sen:{n:"潜在",t:"本来のあなた",d:"心の奥にある、もともと持っている性質"},
 hyo:{n:"表出",t:"周りから見たあなた",d:"人から見られている、表に出ている性質"},
 shi:{n:"志向",t:"なりたいあなた",d:"これからこうなりたい、という理想の性質"}
};
// 各選択肢は [風,水,地,火] の順（風=実現達成/水=感性解放/地=安心調和/火=創造論理）
const Q=[
 ["sen","予定のない休日、気づくとしていることは？",["目標に向けて動く、予定をどんどん入れる","その日の気分で行きたいところへ出かける","気心の知れた人とゆっくり過ごす","好きなことにひとりで没頭する"]],
 ["sen","困ったことが起きたとき、まず心に浮かぶのは？",["とにかく動いて結果を出そう","気持ちが落ち着くまで、少し離れたい","周りと相談して、みんなが納得する形を探そう","原因を突き止めて、筋道を立てて考えよう"]],
 ["sen","心が満たされるのは、どんなとき？",["目標を達成して認められたとき","ワクワクすることや心が動くことがあったとき","みんなが穏やかに過ごせているとき","物事の本質がわかって、腑に落ちたとき"]],
 ["sen","ストレスを感じやすいのは？",["結果が出ず、前に進めないこと","自由がなく、しばられること","予定が崩れたり、場の空気が乱れること","理屈に合わないことや、浅い話につき合わされること"]],
 ["sen","物事を決めるときの決め手は？",["結果につながるかどうか","気持ちがいいか、嬉しいか","みんなにとって良いかどうか","筋が通っていて、納得できるか"]],
 ["sen","子どもの頃の自分に近いのは？",["負けず嫌いで、目立つのが好き","好奇心旺盛で、思いついたらすぐ行動","友達の輪を大切にし、周りに気を配った","ひとつのことにとことん夢中になった"]],
 ["hyo","周りからよく言われるのは？",["行動力があるね、勢いがあるね","感性が豊かだね、自由だね","気配り上手だね、安心する","詳しいね、こだわりがあるね"]],
 ["hyo","グループで自然と任される役割は？",["先頭に立って引っ張る","場を明るくし、ムードをつくる","段取りやまとめ役、調整役","専門的な部分や、問題の分析"]],
 ["hyo","初対面の人に持たれやすい印象は？",["エネルギッシュで堂々としている","親しみやすく、柔らかい","穏やかで、落ち着いている","知的で、ちょっと近寄りがたい"]],
 ["hyo","仕事や家事でほめられるのは？",["スピードと決断力","臨機応変さと、人の話を聞く力","丁寧さと、全体への気配り","専門性と、問題を解く力"]],
 ["hyo","人から相談されやすい内容は？",["挑戦や決断の後押し","気持ちを聞いてほしい話","人間関係の調整や、段取りの話","専門的な知識や、物事の筋道"]],
 ["hyo","会話やSNSで多いのは？",["目標や成果の話","その時感じたことや、好きなものの話","周りの人の様子や、みんなの予定","深く調べたことや、自分の考え"]],
 ["shi","これからの自分に一番ほしいのは？",["大きな成功と実績","心のままに生きられる自由","安心できる、穏やかな毎日","誰にも負けない専門性"]],
 ["shi","憧れるのは、どんな人？",["道を切り開くリーダー","自由に、感じるままに生きる人","みんなに信頼される調整役","ひとつの道を極めた職人や研究者"]],
 ["shi","理想の働き方は？",["成果を出して、どんどん上を目指す","好きな時に好きなことを、楽しく","信頼できる仲間と、長く安定して","専門分野をとことん深める"]],
 ["shi","5年後、言われたい言葉は？",["すごいことをやり遂げたね","いつも楽しそうで、自由だね","あなたがいると安心する","その分野ならあなたに聞けばいい"]],
 ["shi","もっと伸ばしたい力は？",["行動力と、やり切る力","感性と、人に共感する力","計画力と、まとめる力","考える力と、深める力"]],
 ["shi","理想の休日の過ごし方は？",["新しいことに挑戦して、刺激をもらう","思いつくまま、気ままに過ごす","大切な人と、ゆっくり過ごす","ひとりで好きなことを掘り下げる"]]
];
// 選択肢の表示順をシャッフル（問題ごとに固定）
const ORDER=Q.map(()=>{const a=[0,1,2,3];for(let i=3;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a});

let st={name:"",birth:"",i:0,ans:[]};
const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function home(){
 const saved=localStorage.getItem("ec_result_v2");
 app.innerHTML=`<div class="card">
  <h1>4属性で見る<br>こころ診断</h1>
  <p class="sub">風・水・地・火 × 3つのレイヤー</p>
  <div class="els">${KEYS.map(k=>`<div class="el"><div class="ic" style="background:${E[k].c}">${E[k].ic}</div>${E[k].n}</div>`).join("")}</div>
  <p>あなたが「風・水・地・火」の4つのエネルギーを、どれくらい持っているかを診断します。</p>
  <p style="margin-top:10px">「本来のあなた」「周りから見たあなた」「なりたいあなた」の3つに分けて見るので、自分でも気づいていないズレがわかります。</p>
  <p class="sub" style="margin-top:14px">全18問・約3分</p>
  <button class="btn" onclick="profile()">診断をはじめる</button>
  ${saved?'<button class="btn ghost" onclick="showSaved()">前回の結果を見る</button>':''}
 </div>`;
}
function profile(){
 app.innerHTML=`<div class="card"><h2>はじめに</h2>
  <p>結果に表示するお名前を入れてください。</p>
  <label>お名前（ニックネーム可）<input id="nm" value="${esc(st.name)}" placeholder="例：たくみ"></label>
  <label>生年月日（任意）<input id="bd" type="date" value="${esc(st.birth)}"></label>
  <button class="btn" onclick="startQ()">質問にすすむ</button>
  <p class="note">入力した内容はこの端末の中だけに保存され、外部には送信されません。</p></div>`;
}
function startQ(){
 st.name=document.getElementById("nm").value.trim()||"あなた";
 st.birth=document.getElementById("bd").value;
 st.i=0;st.ans=[];question();
}
function question(){
 const [ly,q,opts]=Q[st.i],L=LAYERS[ly];
 const firstOfLayer=st.i===0||Q[st.i-1][0]!==ly;
 app.innerHTML=`<div class="top"><button class="back" onclick="prev()">← 戻る</button><span>${st.i+1} / ${Q.length}</span></div>
 <div class="bar"><i style="width:${st.i/Q.length*100}%"></i></div>
 <div class="card">
  <span class="layer">${L.n}レイヤー：${L.t}</span>
  ${firstOfLayer?`<p class="note" style="margin:0 0 12px">ここからは「${L.d}」についての質問です。${ly==="hyo"?"人からどう見られているかを思い浮かべて答えてください。":ly==="shi"?"今の自分ではなく、なりたい自分を思い浮かべて答えてください。":"考えすぎず、直感で答えてください。"}</p>`:""}
  <div class="q">${q}</div>
  ${ORDER[st.i].map(k=>`<button class="opt ${st.ans[st.i]===k?"sel":""}" onclick="pick(${k})">${opts[k]}</button>`).join("")}
 </div>`;
}
function pick(k){
 st.ans[st.i]=k;
 document.querySelectorAll(".opt").forEach(b=>b.classList.toggle("sel",b.textContent===Q[st.i][2][k]));
 setTimeout(()=>{st.i++;st.i<Q.length?question():finish()},180);
}
function prev(){if(st.i===0){profile();return}st.i--;question()}

function calc(ans){
 const r={};
 for(const ly in LAYERS){r[ly]={wind:0,water:0,earth:0,fire:0};}
 ans.forEach((k,i)=>{r[Q[i][0]][KEYS[k]]++});
 for(const ly in r){const tot=Object.values(r[ly]).reduce((a,b)=>a+b,0)||1;for(const k of KEYS)r[ly][k]=Math.round(r[ly][k]/tot*100);}
 return r;
}
function topEl(o){const m=Math.max(...KEYS.map(k=>o[k]));return KEYS.filter(k=>o[k]===m)}
function finish(){
 const res={name:st.name,birth:st.birth,r:calc(st.ans),at:Date.now()};
 localStorage.setItem("ec_result_v2",JSON.stringify(res));
 result(res);
}
function showSaved(){result(JSON.parse(localStorage.getItem("ec_result_v2")))}

function matrix(r){
 var pos={fire:"tl",wind:"tr",earth:"bl",water:"br"};
 var q=function(k){return '<div class="mq '+pos[k]+'" style="color:'+E[k].c+'"><b class="mt" style="border-color:'+E[k].c+'">'+E[k].n+'</b><div class="kw">'+E[k].kw.join('　')+'</div></div>'};
 var dots=Object.keys(LAYERS).map(function(ly,i){var o=r[ly];var x=((o.wind+o.water)-(o.fire+o.earth))/100;var y=((o.wind+o.fire)-(o.water+o.earth))/100;return '<i class="dot" style="left:'+(50+x*40+(i-1)*3)+'%;top:'+(50-y*40)+'%;background:'+LC[ly]+'">'+LAYERS[ly].n.charAt(0)+'</i>'}).join('');
 var lg=Object.keys(LAYERS).map(function(ly){return '<span><i style="background:'+LC[ly]+'">'+LAYERS[ly].n.charAt(0)+'</i>'+LAYERS[ly].t+'</span>'}).join('');
 return '<div class="mxw"><div class="ax t">男性性／強さ</div><div class="ax b">女性性／優しさ</div><div class="ax l">内向<br>／<br>安定</div><div class="ax r">外向<br>／<br>自由</div><div class="mx">'+q('fire')+q('wind')+q('earth')+q('water')+dots+'</div></div><div class="lg">'+lg+'</div>';
}
function compare(r){
 const s=topEl(r.sen),h=topEl(r.hyo),v=topEl(r.shi);
 const nm=a=>a.map(k=>E[k].n).join("・");
 let t=[];
 if(s.some(k=>h.includes(k))) t.push(`本来のあなた（${nm(s)}）が、そのまま周りにも伝わっています。自分らしさを自然に出せている状態です。`);
 else t.push(`本来のあなたは「${nm(s)}」なのに、周りからは「${nm(h)}」として見られています。知らないうちに、役割に合わせて無理をしているかもしれません。`);
 if(v.some(k=>s.includes(k))) t.push(`なりたい姿（${nm(v)}）は、もともと持っている力の延長にあります。今の強みを素直に伸ばすことが近道です。`);
 else t.push(`なりたい姿は「${nm(v)}」。今はまだ眠っている力を、これから育てていきたい気持ちが表れています。`);
 return t;
}
function result(res){
 var r=res.r,name=res.name,lys=Object.keys(LAYERS);
 var nm=function(t){return t.map(function(k){return E[k].n}).join('・')};
 var summary=lys.map(function(ly){var t=topEl(r[ly]).slice(0,2);return '<div class="sm"><span style="color:'+LC[ly]+'">'+LAYERS[ly].t+'</span><b style="color:'+E[t[0]].c+'">'+nm(t)+'タイプ</b></div>'}).join('');
 var blocks=lys.map(function(ly){
  var L=LAYERS[ly],t=topEl(r[ly]).slice(0,2),m=E[t[0]];
  var bars=KEYS.map(function(k){return '<div><span>'+E[k].n+'</span><em><i style="width:'+r[ly][k]+'%;background:'+E[k].c+'"></i></em><small>'+r[ly][k]+'%</small></div>'}).join('');
  var desc=t.map(function(k){return '<div class="desc" style="border-color:'+E[k].c+'"><p>'+E[k].d+'</p><h3 style="color:'+E[k].c+'">＜この属性と強く関係する行動や環境＞</h3><p>'+E[k].env+'</p></div>'}).join('');
  return '<div class="card"><span class="layer" style="background:'+LC[ly]+'22;color:'+LC[ly]+'">'+L.n+'レイヤー：'+L.t+'</span><div class="res-el"><div class="ic" style="background:'+m.c+'">'+m.n+'</div><div><b>'+nm(t)+'</b>タイプ<br><small>'+t.map(function(k){return E[k].k}).join(' / ')+'</small></div></div><div class="rows">'+bars+'</div>'+desc+'</div>';
 }).join('');
 var table=KEYS.map(function(k){return '<div class="trow"><div class="tl" style="background:'+E[k].c+'">'+E[k].n+'</div><div class="tr"><p>'+E[k].d+'</p><h3>＜この属性と強く関係する行動や環境＞</h3><p>'+E[k].env+'</p></div></div>'}).join('');
 var cmp=compare(r);
 app.innerHTML='<div class="card" style="text-align:center"><p class="sub">診断結果</p><h1>'+esc(name)+'さんの<br>エネルギーバランス</h1><div class="sms">'+summary+'</div></div>'+
 '<div class="card"><h2>属性マトリクス</h2><p class="note" style="margin:0">3つのレイヤーで、あなたがどの位置にいるかを表しています。</p>'+matrix(r)+'</div>'+
 blocks+
 '<div class="card"><h2>3つのレイヤーから見えること</h2>'+cmp.map(function(x){return '<p style="margin-bottom:10px">'+x+'</p>'}).join('')+'</div>'+
 '<div class="card"><h2>各属性の説明</h2>'+table+'</div>'+
 '<div class="card"><h2>もっと詳しく知りたい方へ</h2><p>この結果は簡易版です。公式LINEでは、より詳しい診断レポートや、悩みに合わせたアドバイスをご案内しています。</p><a class="btn line" href="'+LINE_URL+'" target="_blank" rel="noopener">LINEで詳しい診断を受け取る</a><button class="btn ghost" onclick="share()">結果をコピーしてシェア</button><button class="btn ghost" onclick="home()">トップにもどる</button><p class="note">この診断は自己理解のためのもので、医学的な診断ではありません。</p></div>';
 window.scrollTo(0,0);
}
function share(){
 const res=JSON.parse(localStorage.getItem("ec_result_v2")),r=res.r;
 const t=`4属性こころ診断の結果\n本来のわたし：${topEl(r.sen).map(k=>E[k].n).join("・")}\n周りから見たわたし：${topEl(r.hyo).map(k=>E[k].n).join("・")}\nなりたいわたし：${topEl(r.shi).map(k=>E[k].n).join("・")}\n${location.href}`;
 (navigator.share?navigator.share({text:t}):navigator.clipboard.writeText(t).then(()=>alert("コピーしました"))).catch(()=>{});
}
home();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}
</script></body></html>
